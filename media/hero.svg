<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="20" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 6" fill="#555"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="#0a0a0b"/>

  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="500" fill="url(#grid)"/>
  </g>

  <rect x="0" y="0" width="1200" height="1" fill="url(#lineGlow)"/>
  <rect x="0" y="499" width="1200" height="1" fill="url(#lineGlow)"/>

  <!-- ============ BRAND - CENTERED ============ -->

  <g transform="translate(600, 70)">
    <rect x="-26" y="-26" width="52" height="52" rx="13" fill="#fff"/>
    <text x="0" y="7" text-anchor="middle" fill="#000" font-size="24" font-weight="800" letter-spacing="-1">F</text>
  </g>

  <text x="600" y="105" text-anchor="middle" fill="#fafafa" font-size="26" font-weight="700" letter-spacing="-0.4">Forms Hub</text>
  <text x="600" y="128" text-anchor="middle" fill="#888" font-size="14" font-weight="400">Centralized Multitenant Form Submission Backend</text>

  <!-- Tech pills - centered -->
  <g transform="translate(600, 165)">
    <rect x="-148" y="-10" width="72" height="22" rx="11" fill="#151517" stroke="#333" stroke-width="0.5"/>
    <text x="-112" y="5" text-anchor="middle" fill="#999" font-size="10" font-weight="500">TypeScript</text>

    <rect x="-70" y="-10" width="58" height="22" rx="11" fill="#151517" stroke="#333" stroke-width="0.5"/>
    <text x="-41" y="5" text-anchor="middle" fill="#999" font-size="10" font-weight="500">Express</text>

    <rect x="-6" y="-10" width="54" height="22" rx="11" fill="#151517" stroke="#333" stroke-width="0.5"/>
    <text x="21" y="5" text-anchor="middle" fill="#999" font-size="10" font-weight="500">Prisma</text>

    <rect x="54" y="-10" width="74" height="22" rx="11" fill="#151517" stroke="#333" stroke-width="0.5"/>
    <text x="91" y="5" text-anchor="middle" fill="#999" font-size="10" font-weight="500">PostgreSQL</text>
  </g>

  <!-- ============ DIAGRAM - CENTERED ============ -->

  <g transform="translate(224, 210)">
    <!-- Section labels -->
    <text x="160" y="18" text-anchor="middle" fill="#555" font-size="10" font-weight="600" letter-spacing="1.5">ORIGIN</text>
    <text x="444" y="18" text-anchor="middle" fill="#555" font-size="10" font-weight="600" letter-spacing="1.5">API</text>
    <text x="680" y="18" text-anchor="middle" fill="#555" font-size="10" font-weight="600" letter-spacing="1.5">STORAGE</text>

    <!-- Vertical guides -->
    <line x1="342" y1="30" x2="342" y2="260" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="566" y1="30" x2="566" y2="260" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- ===== ORIGIN ===== -->

    <g filter="url(#shadow)">
      <rect x="0" y="35" width="320" height="56" rx="8" fill="#151517" stroke="#2a2a2e" stroke-width="1"/>
      <rect x="0" y="35" width="3" height="56" rx="1.5" fill="#6366f1"/>
      <text x="20" y="56" fill="#fafafa" font-size="13" font-weight="600">Landing Page A</text>
      <text x="20" y="73" fill="#888" font-size="11">portfolio.example.com</text>
      <rect x="210" y="50" width="90" height="20" rx="4" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
      <text x="255" y="63" text-anchor="middle" fill="#666" font-size="8" font-weight="600" font-family="monospace">API KEY</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="0" y="101" width="320" height="56" rx="8" fill="#151517" stroke="#2a2a2e" stroke-width="1"/>
      <rect x="0" y="101" width="3" height="56" rx="1.5" fill="#6366f1"/>
      <text x="20" y="122" fill="#fafafa" font-size="13" font-weight="600">Landing Page B</text>
      <text x="20" y="139" fill="#888" font-size="11">navixsoft.com</text>
      <rect x="210" y="116" width="90" height="20" rx="4" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
      <text x="255" y="129" text-anchor="middle" fill="#666" font-size="8" font-weight="600" font-family="monospace">API KEY</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="0" y="167" width="320" height="44" rx="8" fill="#151517" stroke="#2a2a2e" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="160" y="191" text-anchor="middle" fill="#555" font-size="12" font-weight="500">+ additional origins</text>
    </g>

    <!-- Dots -->
    <circle cx="320" cy="63" r="3" fill="#6366f1"/>
    <circle cx="320" cy="129" r="3" fill="#6366f1"/>
    <circle cx="320" cy="189" r="3" fill="#444"/>

    <!-- Arrows -->
    <line x1="326" y1="63" x2="360" y2="90" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="326" y1="129" x2="360" y2="116" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="326" y1="189" x2="360" y2="155" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- ===== API ===== -->
    <g filter="url(#shadow)">
      <rect x="364" y="35" width="160" height="230" rx="10" fill="#151517" stroke="#2a2a2e" stroke-width="1"/>

      <rect x="364" y="35" width="160" height="38" rx="10" fill="#1c1c1f"/>
      <rect x="364" y="61" width="160" height="12" fill="#1c1c1f"/>
      <circle cx="382" cy="54" r="4" fill="#22c55e"/>
      <text x="394" y="58" fill="#fafafa" font-size="12" font-weight="600">Forms Hub API</text>
      <text x="512" y="58" text-anchor="end" fill="#555" font-size="9" font-family="monospace">v1</text>

      <g transform="translate(378, 88)">
        <rect x="0" y="0" width="132" height="26" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <text x="66" y="17" text-anchor="middle" fill="#999" font-size="10">CORS</text>
      </g>
      <g transform="translate(378, 121)">
        <rect x="0" y="0" width="132" height="26" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <text x="66" y="17" text-anchor="middle" fill="#999" font-size="10">JSON Parser</text>
      </g>
      <g transform="translate(378, 154)">
        <rect x="0" y="0" width="132" height="26" rx="5" fill="#1c1c1f" stroke="#6366f1" stroke-width="0.5"/>
        <text x="66" y="17" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">API Key Validation</text>
      </g>
      <g transform="translate(378, 187)">
        <rect x="0" y="0" width="132" height="26" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <text x="66" y="17" text-anchor="middle" fill="#999" font-size="10">Error Handler</text>
      </g>
      <g transform="translate(378, 220)">
        <rect x="0" y="0" width="132" height="26" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5" stroke-dasharray="4,2"/>
        <text x="66" y="17" text-anchor="middle" fill="#555" font-size="10">Health Check</text>
      </g>
    </g>

    <!-- Arrow + Prisma -->
    <line x1="528" y1="150" x2="556" y2="150" stroke="#555" stroke-width="1"/>
    <rect x="540" y="138" width="56" height="24" rx="12" fill="#1c1c1f" stroke="#555" stroke-width="0.5" filter="url(#shadow)"/>
    <text x="568" y="153" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="700">Prisma</text>
    <line x1="600" y1="150" x2="570" y2="150" stroke="#555" stroke-width="1"/>
    <polygon points="600,147 606,150 600,153" fill="#555"/>

    <!-- ===== DB ===== -->
    <g filter="url(#shadow)">
      <rect x="608" y="35" width="145" height="230" rx="10" fill="#151517" stroke="#2a2a2e" stroke-width="1"/>

      <rect x="608" y="35" width="145" height="38" rx="10" fill="#1c1c1f"/>
      <rect x="608" y="61" width="145" height="12" fill="#1c1c1f"/>
      <text x="680" y="58" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="600">PostgreSQL</text>

      <g transform="translate(649, 80)">
        <ellipse cx="32" cy="8" rx="32" ry="6" fill="none" stroke="#555" stroke-width="1"/>
        <path d="M0,8 L0,26 A32,6 0 0,0 64,26 L64,8" fill="none" stroke="#555" stroke-width="1"/>
        <ellipse cx="32" cy="26" rx="32" ry="6" fill="none" stroke="#555" stroke-width="1"/>
        <path d="M0,8 A32,6 0 0,0 64,8" fill="none" stroke="#555" stroke-width="1"/>
      </g>

      <g transform="translate(618, 128)">
        <rect x="0" y="0" width="125" height="26" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="10" cy="13" r="3" fill="#6366f1"/>
        <text x="18" y="17" fill="#fafafa" font-size="10" font-weight="500">users</text>

        <line x1="5" y1="32" x2="30" y2="36" stroke="#444" stroke-width="1"/>
        <circle cx="5" cy="32" r="2" fill="#444"/>
        <text x="34" y="38" fill="#555" font-size="8">1:N</text>

        <rect x="0" y="44" width="125" height="26" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="10" cy="57" r="3" fill="#6366f1"/>
        <text x="18" y="61" fill="#fafafa" font-size="10" font-weight="500">projects</text>

        <line x1="5" y1="76" x2="30" y2="80" stroke="#444" stroke-width="1"/>
        <circle cx="5" cy="76" r="2" fill="#444"/>
        <text x="34" y="82" fill="#555" font-size="8">1:N</text>

        <rect x="0" y="88" width="125" height="26" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="10" cy="101" r="3" fill="#6366f1"/>
        <text x="18" y="105" fill="#fafafa" font-size="10" font-weight="500">form_submissions</text>
      </g>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="488" text-anchor="middle" fill="#444" font-size="11" font-weight="400">TypeScript / Express 5 / Prisma ORM / PostgreSQL</text>
</svg>
