<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="20" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#0a0a0b"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="480" fill="url(#grid)"/>
  </g>

  <!-- Top line -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#lineGlow)"/>

  <!-- ============ HERO ============ -->

  <!-- Logo mark -->
  <g transform="translate(80, 70)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="#fff" filter="url(#cardShadow)"/>
    <text x="0" y="7" text-anchor="middle" fill="#000" font-size="26" font-weight="800" letter-spacing="-1">F</text>
    <text x="0" y="40" text-anchor="middle" fill="#fafafa" font-size="28" font-weight="700" letter-spacing="-0.5">Forms Hub</text>
    <text x="0" y="62" text-anchor="middle" fill="#888" font-size="13" font-weight="400">Centralized Multitenant Form Submission Backend</text>
  </g>

  <!-- Status bar -->
  <g transform="translate(80, 175)">
    <circle cx="6" cy="6" r="4" fill="#22c55e"/>
    <circle cx="6" cy="6" r="4" fill="#22c55e" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10" fill="#888" font-size="12" font-weight="500">All systems operational</text>
  </g>

  <!-- Tech pill row -->
  <g transform="translate(80, 215)">
    <rect x="0" y="-12" width="80" height="24" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="40" y="4" text-anchor="middle" fill="#bbb" font-size="11" font-weight="500">TypeScript</text>

    <rect x="88" y="-12" width="65" height="24" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="120" y="4" text-anchor="middle" fill="#bbb" font-size="11" font-weight="500">Express</text>

    <rect x="161" y="-12" width="60" height="24" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="191" y="4" text-anchor="middle" fill="#bbb" font-size="11" font-weight="500">Prisma</text>

    <rect x="229" y="-12" width="80" height="24" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="269" y="4" text-anchor="middle" fill="#bbb" font-size="11" font-weight="500">PostgreSQL</text>
  </g>

  <!-- ============ DIAGRAM ============ -->

  <g transform="translate(420, 60)">
    <!-- Column headers -->
    <text x="130" y="20" text-anchor="middle" fill="#666" font-size="10" font-weight="600" letter-spacing="1.5">ORIGIN</text>
    <text x="355" y="20" text-anchor="middle" fill="#666" font-size="10" font-weight="600" letter-spacing="1.5">API</text>
    <text x="585" y="20" text-anchor="middle" fill="#666" font-size="10" font-weight="600" letter-spacing="1.5">STORAGE</text>

    <!-- Vertical connector lines -->
    <line x1="240" y1="35" x2="240" y2="280" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
    <line x1="470" y1="35" x2="470" y2="280" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- ===== ORIGIN CARDS ===== -->

    <!-- LP 1 -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="35" width="240" height="64" rx="8" fill="#151517" stroke="#2a2a2e" stroke-width="1"/>
      <rect x="0" y="35" width="3" height="64" rx="1.5" fill="#6366f1"/>
      <text x="20" y="59" fill="#fafafa" font-size="13" font-weight="600">Landing Page A</text>
      <text x="20" y="78" fill="#888" font-size="11">portfolio.example.com</text>
      <text x="230" y="78" text-anchor="end" fill="#666" font-size="9" font-family="monospace">api-key</text>
    </g>

    <!-- LP 2 -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="110" width="240" height="64" rx="8" fill="#151517" stroke="#2a2a2e" stroke-width="1"/>
      <rect x="0" y="110" width="3" height="64" rx="1.5" fill="#6366f1"/>
      <text x="20" y="134" fill="#fafafa" font-size="13" font-weight="600">Landing Page B</text>
      <text x="20" y="153" fill="#888" font-size="11">navixsoft.com</text>
      <text x="230" y="153" text-anchor="end" fill="#666" font-size="9" font-family="monospace">api-key</text>
    </g>

    <!-- LP More -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="185" width="240" height="50" rx="8" fill="#151517" stroke="#2a2a2e" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="120" y="212" text-anchor="middle" fill="#666" font-size="12" font-weight="500">+ additional origins</text>
    </g>

    <!-- Connection dots -->
    <circle cx="240" cy="67" r="3" fill="#6366f1"/>
    <circle cx="240" cy="142" r="3" fill="#6366f1"/>
    <circle cx="240" cy="210" r="3" fill="#555"/>

    <!-- ===== ARROWS ===== -->
    <line x1="246" y1="67" x2="288" y2="100" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="246" y1="142" x2="288" y2="130" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <line x1="246" y1="210" x2="288" y2="165" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- ===== API CARD ===== -->
    <g filter="url(#cardShadow)">
      <rect x="292" y="35" width="174" height="250" rx="10" fill="#151517" stroke="#2a2a2e" stroke-width="1"/>

      <!-- Header -->
      <rect x="292" y="35" width="174" height="40" rx="10" fill="#1c1c1f"/>
      <rect x="292" y="63" width="174" height="12" fill="#1c1c1f"/>
      <circle cx="310" cy="55" r="4" fill="#22c55e"/>
      <text x="322" y="59" fill="#fafafa" font-size="12" font-weight="600">Forms Hub API</text>
      <text x="452" y="59" text-anchor="end" fill="#666" font-size="9" font-family="monospace">v1</text>

      <!-- Middleware lines -->
      <g transform="translate(305, 90)">
        <rect x="0" y="0" width="148" height="28" rx="6" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="14" cy="14" r="3" fill="#555"/>
        <text x="74" y="18" text-anchor="middle" fill="#999" font-size="10">CORS</text>
      </g>

      <g transform="translate(305, 126)">
        <rect x="0" y="0" width="148" height="28" rx="6" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="14" cy="14" r="3" fill="#555"/>
        <text x="74" y="18" text-anchor="middle" fill="#999" font-size="10">JSON Parser</text>
      </g>

      <g transform="translate(305, 162)">
        <rect x="0" y="0" width="148" height="28" rx="6" fill="#1c1c1f" stroke="#6366f1" stroke-width="0.5"/>
        <circle cx="14" cy="14" r="3" fill="#6366f1"/>
        <text x="74" y="18" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">API Key Validation</text>
        <rect x="126" y="6" width="16" height="16" rx="4" fill="#6366f1"/>
        <text x="134" y="17" text-anchor="middle" fill="#fff" font-size="8">🔑</text>
      </g>

      <g transform="translate(305, 198)">
        <rect x="0" y="0" width="148" height="28" rx="6" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="14" cy="14" r="3" fill="#555"/>
        <text x="74" y="18" text-anchor="middle" fill="#999" font-size="10">Error Handler</text>
      </g>

      <g transform="translate(305, 234)">
        <rect x="0" y="0" width="148" height="28" rx="6" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5" stroke-dasharray="4,2"/>
        <circle cx="14" cy="14" r="3" fill="#444"/>
        <text x="74" y="18" text-anchor="middle" fill="#666" font-size="10">Health Check</text>
      </g>
    </g>

    <!-- ===== ARROW API → DB ===== -->
    <line x1="470" y1="160" x2="496" y2="160" stroke="#555" stroke-width="1"/>

    <!-- Prisma pill -->
    <rect x="480" y="148" width="56" height="24" rx="12" fill="#1c1c1f" stroke="#555" stroke-width="0.5" filter="url(#cardShadow)"/>
    <text x="508" y="163" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="700">Prisma</text>

    <line x1="540" y1="160" x2="504" y2="160" stroke="#555" stroke-width="1"/>
    <polygon points="540,157 546,160 540,163" fill="#555"/>

    <!-- ===== DB CARD ===== -->
    <g filter="url(#cardShadow)">
      <rect x="548" y="35" width="165" height="250" rx="10" fill="#151517" stroke="#2a2a2e" stroke-width="1"/>

      <!-- Header -->
      <rect x="548" y="35" width="165" height="40" rx="10" fill="#1c1c1f"/>
      <rect x="548" y="63" width="165" height="12" fill="#1c1c1f"/>
      <text x="630" y="59" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="600">PostgreSQL</text>

      <!-- Cylinder icon -->
      <g transform="translate(599, 82)">
        <ellipse cx="32" cy="8" rx="32" ry="6" fill="none" stroke="#555" stroke-width="1"/>
        <path d="M0,8 L0,26 A32,6 0 0,0 64,26 L64,8" fill="none" stroke="#555" stroke-width="1"/>
        <ellipse cx="32" cy="26" rx="32" ry="6" fill="none" stroke="#555" stroke-width="1"/>
        <path d="M0,8 A32,6 0 0,0 64,8" fill="none" stroke="#555" stroke-width="1"/>
      </g>

      <!-- Tables -->
      <g transform="translate(558, 130)">
        <rect x="0" y="0" width="145" height="30" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="12" cy="15" r="3" fill="#6366f1"/>
        <text x="22" y="19" fill="#fafafa" font-size="11" font-weight="500">users</text>
        <text x="140" y="19" text-anchor="end" fill="#666" font-size="8">PK</text>

        <line x1="6" y1="36" x2="36" y2="40" stroke="#444" stroke-width="1"/>
        <circle cx="6" cy="36" r="2" fill="#444"/>
        <text x="40" y="42" fill="#555" font-size="8">1:N</text>

        <rect x="0" y="48" width="145" height="30" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="12" cy="63" r="3" fill="#6366f1"/>
        <text x="22" y="67" fill="#fafafa" font-size="11" font-weight="500">projects</text>
        <text x="140" y="67" text-anchor="end" fill="#666" font-size="8">FK</text>

        <line x1="6" y1="84" x2="36" y2="88" stroke="#444" stroke-width="1"/>
        <circle cx="6" cy="84" r="2" fill="#444"/>
        <text x="40" y="90" fill="#555" font-size="8">1:N</text>

        <rect x="0" y="96" width="145" height="30" rx="5" fill="#1c1c1f" stroke="#2a2a2e" stroke-width="0.5"/>
        <circle cx="12" cy="111" r="3" fill="#6366f1"/>
        <text x="22" y="115" fill="#fafafa" font-size="11" font-weight="500">form_submissions</text>
        <text x="140" y="115" text-anchor="end" fill="#666" font-size="8">JSONB</text>
      </g>
    </g>
  </g>

  <!-- Bottom line -->
  <rect x="0" y="479" width="1200" height="1" fill="url(#lineGlow)"/>

  <!-- Bottom tagline -->
  <text x="600" y="462" text-anchor="middle" fill="#444" font-size="11" font-weight="400">TypeScript · Express 5 · Prisma ORM · PostgreSQL</text>
</svg>
