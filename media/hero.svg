<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="brandLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eef2ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="badgePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boxLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowDeep">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#fafbfc"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.15">
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6366f1"/>
    </pattern>
    <rect width="1200" height="480" fill="url(#dotGrid)"/>
  </g>

  <!-- Logo area -->
  <g transform="translate(80, 80)">
    <rect x="-32" y="-32" width="64" height="64" rx="16" fill="url(#brand)" filter="url(#shadowDeep)"/>
    <text x="0" y="6" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">F</text>
    <text x="0" y="50" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800" letter-spacing="-0.3">Forms Hub</text>
    <text x="0" y="70" text-anchor="middle" fill="#64748b" font-size="13" font-weight="400">Multitenant Form Submission Backend</text>

    <!-- Tech badges -->
    <g transform="translate(0, 95)">
      <rect x="-80" y="-10" height="24" width="70" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.5"/>
      <text x="-45" y="6" text-anchor="middle" fill="#4f46e5" font-size="10" font-weight="600">TypeScript</text>

      <rect x="-5" y="-10" height="24" width="60" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.5"/>
      <text x="25" y="6" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">Express</text>

      <rect x="60" y="-10" height="24" width="55" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.5"/>
      <text x="87" y="6" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="600">Prisma</text>

      <rect x="120" y="-10" height="24" width="70" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.5"/>
      <text x="155" y="6" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="600">PostgreSQL</text>
    </g>
  </g>

  <!-- Flow diagram -->
  <g transform="translate(420, 50)">
    <!-- Section labels -->
    <text x="0" y="20" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1.5">ORIGIN</text>
    <text x="270" y="20" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1.5">API</text>
    <text x="540" y="20" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1.5">STORAGE</text>

    <!-- ORIGIN boxes -->
    <g filter="url(#shadow)">
      <rect x="0" y="35" width="200" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="35" width="200" height="3" rx="1.5" fill="#3b82f6"/>
      <circle cx="24" cy="64" r="10" fill="#eff6ff"/>
      <text x="24" y="68" text-anchor="middle" fill="#2563eb" font-size="11">🌐</text>
      <text x="42" y="61" fill="#0f172a" font-size="12" font-weight="600">Landing Page A</text>
      <text x="42" y="77" fill="#64748b" font-size="10">portfolio.example.com</text>
      <text x="42" y="95" fill="#94a3b8" font-size="9">→ x-api-key: f8a2...b1e3</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="0" y="125" width="200" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="125" width="200" height="3" rx="1.5" fill="#10b981"/>
      <circle cx="24" cy="154" r="10" fill="#ecfdf5"/>
      <text x="24" y="158" text-anchor="middle" fill="#059669" font-size="11">🌐</text>
      <text x="42" y="151" fill="#0f172a" font-size="12" font-weight="600">Landing Page B</text>
      <text x="42" y="167" fill="#64748b" font-size="10">navixsoft.com</text>
      <text x="42" y="185" fill="#94a3b8" font-size="9">→ x-api-key: a7c9...d4f2</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="0" y="215" width="200" height="50" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,3"/>
      <circle cx="20" cy="240" r="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="243" text-anchor="middle" fill="#94a3b8" font-size="10">+</text>
      <text x="36" y="237" fill="#64748b" font-size="12" font-weight="500">More landing pages</text>
      <text x="36" y="253" fill="#94a3b8" font-size="9">Additional projects</text>
    </g>

    <!-- Arrows ORIGIN → API -->
    <line x1="205" y1="75" x2="255" y2="85" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="205" y1="165" x2="255" y2="155" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="205" y1="240" x2="255" y2="145" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- API Box -->
    <g filter="url(#shadowDeep)">
      <rect x="260" y="35" width="230" height="240" rx="14" fill="#fff" stroke="#e0e7ff" stroke-width="1.5"/>

      <!-- Header -->
      <rect x="260" y="35" width="230" height="44" rx="14" fill="#f8fafc"/>
      <rect x="260" y="65" width="230" height="14" fill="#f8fafc"/>
      <circle cx="282" cy="57" r="5" fill="#10b981"/>
      <text x="294" y="61" fill="#0f172a" font-size="13" font-weight="700">Forms Hub API</text>
      <text x="478" y="61" text-anchor="end" fill="#94a3b8" font-size="10" font-weight="600">v1</text>

      <!-- Middleware list -->
      <g transform="translate(275, 95)">
        <rect x="0" y="0" width="200" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
        <circle cx="14" cy="14" r="4" fill="#6366f1"/>
        <text x="24" y="18" fill="#475569" font-size="11">CORS Configuration</text>
      </g>

      <g transform="translate(275, 133)">
        <rect x="0" y="0" width="200" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
        <circle cx="14" cy="14" r="4" fill="#6366f1"/>
        <text x="24" y="18" fill="#475569" font-size="11">JSON Body Parser</text>
      </g>

      <g transform="translate(275, 171)">
        <rect x="0" y="0" width="200" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.5"/>
        <circle cx="14" cy="14" r="4" fill="#4f46e5"/>
        <text x="24" y="18" fill="#4f46e5" font-size="11" font-weight="600">API Key Validation</text>
        <rect x="168" y="6" width="24" height="16" rx="4" fill="#6366f1"/>
        <text x="180" y="17" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">🔒</text>
      </g>

      <g transform="translate(275, 209)">
        <rect x="0" y="0" width="200" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
        <circle cx="14" cy="14" r="4" fill="#6366f1"/>
        <text x="24" y="18" fill="#475569" font-size="11">Error Handler</text>
      </g>

      <g transform="translate(275, 247)">
        <rect x="0" y="0" width="200" height="20" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,2"/>
        <text x="100" y="14" text-anchor="middle" fill="#94a3b8" font-size="10">+ more middleware</text>
      </g>
    </g>

    <!-- Arrow API → DB -->
    <line x1="495" y1="155" x2="525" y2="155" stroke="#c7d2fe" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Prisma pill -->
    <rect x="500" y="140" width="60" height="22" rx="11" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.5"/>
    <text x="530" y="154" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="700">Prisma</text>

    <!-- Arrow stub after Prisma -->
    <line x1="562" y1="151" x2="530" y2="151" stroke="#c7d2fe" stroke-width="1.5" opacity="0"/>
    <line x1="565" y1="155" x2="525" y2="155" stroke="#c7d2fe" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- STORAGE Box -->
    <g filter="url(#shadowDeep)">
      <rect x="530" y="35" width="220" height="240" rx="14" fill="#fff" stroke="#e0e7ff" stroke-width="1.5"/>

      <!-- Header -->
      <rect x="530" y="35" width="220" height="44" rx="14" fill="#f8fafc"/>
      <rect x="530" y="65" width="220" height="14" fill="#f8fafc"/>
      <circle cx="552" cy="57" r="5" fill="#8b5cf6"/>
      <text x="564" y="61" fill="#0f172a" font-size="13" font-weight="700">PostgreSQL</text>

      <!-- DB cylinder icon -->
      <g transform="translate(610, 90)">
        <ellipse cx="30" cy="10" rx="30" ry="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
        <path d="M0,10 L0,30 A30,8 0 0,0 60,30 L60,10" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1"/>
        <ellipse cx="30" cy="30" rx="30" ry="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
        <text x="30" y="28" text-anchor="middle" fill="#6366f1" font-size="13">🗄️</text>
      </g>

      <!-- Tables -->
      <g transform="translate(545, 135)">
        <line x1="0" y1="0" x2="190" y2="0" stroke="#e2e8f0" stroke-width="1"/>

        <rect x="0" y="10" width="190" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
        <circle cx="14" cy="26" r="4" fill="#3b82f6"/>
        <text x="24" y="30" fill="#0f172a" font-size="11" font-weight="600">users</text>
        <text x="185" y="30" text-anchor="end" fill="#94a3b8" font-size="9">id · email · passwordHash</text>

        <line x1="8" y1="48" x2="48" y2="52" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
        <circle cx="8" cy="48" r="2" fill="#cbd5e1"/>
        <text x="50" y="54" fill="#94a3b8" font-size="8">1:N</text>

        <rect x="0" y="62" width="190" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
        <circle cx="14" cy="78" r="4" fill="#10b981"/>
        <text x="24" y="82" fill="#0f172a" font-size="11" font-weight="600">projects</text>
        <text x="185" y="82" text-anchor="end" fill="#94a3b8" font-size="9">id · name · apiKey</text>

        <line x1="8" y1="100" x2="48" y2="104" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
        <circle cx="8" cy="100" r="2" fill="#cbd5e1"/>
        <text x="50" y="106" fill="#94a3b8" font-size="8">1:N</text>

        <rect x="0" y="114" width="190" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
        <circle cx="14" cy="130" r="4" fill="#f59e0b"/>
        <text x="24" y="134" fill="#0f172a" font-size="11" font-weight="600">form_submissions</text>
        <text x="185" y="134" text-anchor="end" fill="#94a3b8" font-size="9">payload (JSONB)</text>
      </g>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="460" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="400">Built with TypeScript · Express 5 · Prisma ORM · PostgreSQL</text>
</svg>
