<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0.04"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#000"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="480" fill="url(#grid)"/>
  </g>

  <!-- Top line -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#lineGlow)"/>

  <!-- ============ HERO ============ -->

  <!-- Logo mark -->
  <g transform="translate(80, 70)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="#fff" filter="url(#cardShadow)"/>
    <text x="0" y="7" text-anchor="middle" fill="#000" font-size="26" font-weight="800" letter-spacing="-1">F</text>
    <text x="0" y="40" text-anchor="middle" fill="#fff" font-size="28" font-weight="700" letter-spacing="-0.5">Forms Hub</text>
    <text x="0" y="62" text-anchor="middle" fill="#555" font-size="13" font-weight="400">Centralized Multitenant Form Submission Backend</text>
  </g>

  <!-- Status bar -->
  <g transform="translate(80, 175)">
    <circle cx="6" cy="6" r="4" fill="#22c55e"/>
    <circle cx="6" cy="6" r="4" fill="#22c55e" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10" fill="#555" font-size="12" font-weight="500">All systems operational</text>
  </g>

  <!-- Tech pill row -->
  <g transform="translate(80, 215)">
    <rect x="0" y="-12" width="80" height="24" rx="12" fill="url(#pillBg)" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="40" y="4" text-anchor="middle" fill="#888" font-size="11" font-weight="500">TypeScript</text>

    <rect x="88" y="-12" width="65" height="24" rx="12" fill="url(#pillBg)" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="120" y="4" text-anchor="middle" fill="#888" font-size="11" font-weight="500">Express</text>

    <rect x="161" y="-12" width="60" height="24" rx="12" fill="url(#pillBg)" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="191" y="4" text-anchor="middle" fill="#888" font-size="11" font-weight="500">Prisma</text>

    <rect x="229" y="-12" width="80" height="24" rx="12" fill="url(#pillBg)" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="269" y="4" text-anchor="middle" fill="#888" font-size="11" font-weight="500">PostgreSQL</text>
  </g>

  <!-- ============ DIAGRAM ============ -->

  <g transform="translate(420, 60)">
    <!-- Column headers -->
    <text x="130" y="20" text-anchor="middle" fill="#333" font-size="10" font-weight="600" letter-spacing="1.5">ORIGIN</text>
    <text x="355" y="20" text-anchor="middle" fill="#333" font-size="10" font-weight="600" letter-spacing="1.5">API</text>
    <text x="585" y="20" text-anchor="middle" fill="#333" font-size="10" font-weight="600" letter-spacing="1.5">STORAGE</text>

    <!-- Vertical connector lines -->
    <line x1="240" y1="35" x2="240" y2="280" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="470" y1="35" x2="470" y2="280" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- ===== ORIGIN CARDS ===== -->

    <!-- LP 1 -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="35" width="240" height="64" rx="8" fill="#111" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
      <rect x="0" y="35" width="3" height="64" rx="1.5" fill="#fff" opacity="0.15"/>
      <text x="20" y="59" fill="#fff" font-size="13" font-weight="600">Landing Page A</text>
      <text x="20" y="78" fill="#444" font-size="11">portfolio.example.com</text>
      <text x="230" y="78" text-anchor="end" fill="#555" font-size="9" font-family="monospace">api-key</text>
    </g>

    <!-- LP 2 -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="110" width="240" height="64" rx="8" fill="#111" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
      <rect x="0" y="110" width="3" height="64" rx="1.5" fill="#fff" opacity="0.15"/>
      <text x="20" y="134" fill="#fff" font-size="13" font-weight="600">Landing Page B</text>
      <text x="20" y="153" fill="#444" font-size="11">navixsoft.com</text>
      <text x="230" y="153" text-anchor="end" fill="#555" font-size="9" font-family="monospace">api-key</text>
    </g>

    <!-- LP More -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="185" width="240" height="50" rx="8" fill="#111" stroke="#fff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="120" y="212" text-anchor="middle" fill="#444" font-size="12" font-weight="500">+ additional origins</text>
    </g>

    <!-- Connection dots on right edge of origin cards -->
    <circle cx="240" cy="67" r="3" fill="#fff" opacity="0.15"/>
    <circle cx="240" cy="142" r="3" fill="#fff" opacity="0.15"/>
    <circle cx="240" cy="210" r="3" fill="#fff" opacity="0.1"/>

    <!-- ===== ARROWS ===== -->
    <line x1="245" y1="67" x2="288" y2="100" stroke="#fff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="245" y1="142" x2="288" y2="130" stroke="#fff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="245" y1="210" x2="288" y2="165" stroke="#fff" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- ===== API CARD ===== -->
    <g filter="url(#cardShadow)">
      <rect x="292" y="35" width="174" height="250" rx="10" fill="#111" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>

      <!-- Header -->
      <rect x="292" y="35" width="174" height="40" rx="10" fill="#000"/>
      <rect x="292" y="63" width="174" height="12" fill="#000"/>
      <text x="379" y="59" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">API</text>

      <!-- Middleware lines -->
      <g transform="translate(305, 90)">
        <rect x="0" y="0" width="148" height="26" rx="5" fill="#000" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
        <text x="74" y="17" text-anchor="middle" fill="#555" font-size="10">CORS</text>
      </g>

      <g transform="translate(305, 125)">
        <rect x="0" y="0" width="148" height="26" rx="5" fill="#000" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
        <text x="74" y="17" text-anchor="middle" fill="#555" font-size="10">JSON Parser</text>
      </g>

      <g transform="translate(305, 160)">
        <rect x="0" y="0" width="148" height="26" rx="5" fill="#000" stroke="#fff" stroke-opacity="0.1" stroke-width="0.5"/>
        <rect x="0" y="0" width="3" height="26" rx="1.5" fill="#fff" opacity="0.3"/>
        <text x="74" y="17" text-anchor="middle" fill="#aaa" font-size="10" font-weight="500">API Key Validation</text>
      </g>

      <g transform="translate(305, 195)">
        <rect x="0" y="0" width="148" height="26" rx="5" fill="#000" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
        <text x="74" y="17" text-anchor="middle" fill="#555" font-size="10">Error Handler</text>
      </g>

      <g transform="translate(305, 230)">
        <rect x="0" y="0" width="148" height="26" rx="5" fill="#000" stroke="#fff" stroke-opacity="0.04" stroke-width="0.5" stroke-dasharray="3,2"/>
        <text x="74" y="17" text-anchor="middle" fill="#333" font-size="10">Health Check</text>
      </g>

      <!-- Endpoint tag -->
      <rect x="305" y="260" width="148" height="18" rx="4" fill="#000" stroke="#fff" stroke-opacity="0.04" stroke-width="0.5"/>
      <text x="379" y="272" text-anchor="middle" fill="#333" font-size="9" font-family="monospace">/api/v1</text>
    </g>

    <!-- ===== ARROW API → DB ===== -->
    <line x1="470" y1="160" x2="498" y2="160" stroke="#fff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Prisma pill -->
    <rect x="480" y="148" width="55" height="22" rx="11" fill="#000" stroke="#fff" stroke-opacity="0.08" stroke-width="0.5" filter="url(#cardShadow)"/>
    <text x="507" y="162" text-anchor="middle" fill="#666" font-size="9" font-weight="600">Prisma</text>

    <line x1="539" y1="160" x2="505" y2="160" stroke="#fff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- ===== DB CARD ===== -->
    <g filter="url(#cardShadow)">
      <rect x="545" y="35" width="165" height="250" rx="10" fill="#111" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>

      <!-- Header -->
      <rect x="545" y="35" width="165" height="40" rx="10" fill="#000"/>
      <rect x="545" y="63" width="165" height="12" fill="#000"/>
      <text x="627" y="59" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Database</text>

      <!-- Cylinder icon -->
      <g transform="translate(595, 82)">
        <ellipse cx="32" cy="8" rx="32" ry="6" fill="#fff" opacity="0.06"/>
        <path d="M0,8 L0,26 A32,6 0 0,0 64,26 L64,8" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>
        <ellipse cx="32" cy="26" rx="32" ry="6" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>
      </g>

      <!-- Tables -->
      <g transform="translate(555, 130)">
        <rect x="0" y="0" width="145" height="28" rx="4" fill="#000" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
        <circle cx="12" cy="14" r="3" fill="#fff" opacity="0.15"/>
        <text x="22" y="18" fill="#fff" font-size="11" font-weight="500">users</text>
        <text x="140" y="18" text-anchor="end" fill="#444" font-size="8">PK</text>

        <line x1="6" y1="34" x2="40" y2="38" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
        <circle cx="6" cy="34" r="2" fill="#fff" opacity="0.06"/>
        <text x="44" y="40" fill="#333" font-size="8">1:N</text>

        <rect x="0" y="46" width="145" height="28" rx="4" fill="#000" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
        <circle cx="12" cy="60" r="3" fill="#fff" opacity="0.15"/>
        <text x="22" y="64" fill="#fff" font-size="11" font-weight="500">projects</text>
        <text x="140" y="64" text-anchor="end" fill="#444" font-size="8">FK</text>

        <line x1="6" y1="80" x2="40" y2="84" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
        <circle cx="6" cy="80" r="2" fill="#fff" opacity="0.06"/>
        <text x="44" y="86" fill="#333" font-size="8">1:N</text>

        <rect x="0" y="92" width="145" height="28" rx="4" fill="#000" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>
        <circle cx="12" cy="106" r="3" fill="#fff" opacity="0.15"/>
        <text x="22" y="110" fill="#fff" font-size="11" font-weight="500">form_submissions</text>
        <text x="140" y="110" text-anchor="end" fill="#444" font-size="8">JSONB</text>
      </g>
    </g>
  </g>

  <!-- Bottom line -->
  <rect x="0" y="479" width="1200" height="1" fill="url(#lineGlow)"/>
</svg>
