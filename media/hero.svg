<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid pattern overlay -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">Forms Hub</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="400" letter-spacing="0.5">Centralized Multitenant Form Submission Backend</text>

  <!-- Divider -->
  <line x1="200" y1="95" x2="1000" y2="95" stroke="#334155" stroke-width="1"/>

  <!-- ============ LANDING PAGES (LEFT) ============ -->

  <!-- LP 1 -->
  <rect x="40" y="140" width="180" height="90" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="140" width="180" height="4" rx="2" fill="url(#cardGrad1)"/>
  <text x="130" y="175" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">LANDING PAGE</text>
  <text x="130" y="195" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Mi Portfolio</text>
  <text x="130" y="215" text-anchor="middle" fill="#64748b" font-size="10">Contact Form</text>

  <!-- LP 2 -->
  <rect x="40" y="250" width="180" height="90" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="250" width="180" height="4" rx="2" fill="url(#cardGrad2)"/>
  <text x="130" y="285" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">LANDING PAGE</text>
  <text x="130" y="305" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Navixsoft</text>
  <text x="130" y="325" text-anchor="middle" fill="#64748b" font-size="10">Quote Request</text>

  <!-- LP 3 -->
  <rect x="40" y="115" width="0" height="0" rx="0" fill="none"/>
  <text x="130" y="368" text-anchor="middle" fill="#475569" font-size="11" font-weight="400">+ more landing pages</text>

  <!-- ============ ARROWS LP → API ============ -->
  <line x1="225" y1="185" x2="365" y2="230" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowBlue)" opacity="0.8"/>
  <line x1="225" y1="295" x2="365" y2="250" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)" opacity="0.8"/>

  <!-- API Key label on arrows -->
  <text x="280" y="195" fill="#60a5fa" font-size="9" font-weight="500" transform="rotate(-20, 280, 195)">x-api-key</text>
  <text x="280" y="278" fill="#34d399" font-size="9" font-weight="500" transform="rotate(20, 280, 278)">x-api-key</text>

  <!-- ============ CENTRAL API ============ -->
  <rect x="370" y="155" width="240" height="170" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="370" y="155" width="240" height="6" rx="3" fill="url(#centerGrad)"/>

  <!-- Server icon -->
  <circle cx="490" cy="195" r="18" fill="#4f46e5" opacity="0.2"/>
  <text x="490" y="200" text-anchor="middle" fill="#a5b4fc" font-size="16">⚡</text>

  <text x="490" y="230" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Express Server</text>
  <text x="490" y="248" text-anchor="middle" fill="#94a3b8" font-size="11">REST API v1</text>

  <line x1="390" y1="260" x2="590" y2="260" stroke="#334155" stroke-width="1"/>

  <!-- Middleware badges -->
  <rect x="385" y="270" width="70" height="20" rx="10" fill="#334155" stroke="#475569" stroke-width="0.5"/>
  <text x="420" y="283" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="500">CORS</text>

  <rect x="465" y="270" width="70" height="20" rx="10" fill="#334155" stroke="#475569" stroke-width="0.5"/>
  <text x="500" y="283" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="500">JSON</text>

  <rect x="545" y="270" width="50" height="20" rx="10" fill="#334155" stroke="#475569" stroke-width="0.5"/>
  <text x="570" y="283" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="500">Auth</text>

  <rect x="385" y="296" width="210" height="20" rx="10" fill="#334155" stroke="#475569" stroke-width="0.5"/>
  <text x="490" y="309" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="500">Error Handler</text>

  <!-- ============ ARROW API → DB ============ -->
  <line x1="615" y1="240" x2="745" y2="240" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowPurple)" opacity="0.9"/>

  <!-- Prisma label -->
  <rect x="640" y="210" width="80" height="18" rx="9" fill="#2d3748" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="680" y="223" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="600">Prisma ORM</text>

  <!-- ============ DATABASE (RIGHT) ============ -->
  <rect x="750" y="120" width="230" height="240" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="750" y="120" width="230" height="6" rx="3" fill="url(#dbGrad)"/>

  <!-- DB icon -->
  <circle cx="865" cy="160" r="18" fill="#7c3aed" opacity="0.2"/>
  <text x="865" y="165" text-anchor="middle" fill="#c4b5fd" font-size="16">🗄️</text>

  <text x="865" y="190" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">PostgreSQL</text>
  <text x="865" y="206" text-anchor="middle" fill="#94a3b8" font-size="10">JSONB Payload</text>

  <line x1="770" y1="218" x2="960" y2="218" stroke="#334155" stroke-width="1"/>

  <!-- Table Users -->
  <rect x="765" y="228" width="200" height="38" rx="8" fill="#2d3748" stroke="#475569" stroke-width="0.5"/>
  <rect x="765" y="228" width="4" height="38" rx="2" fill="#3b82f6"/>
  <text x="865" y="245" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">Users</text>
  <text x="865" y="258" text-anchor="middle" fill="#64748b" font-size="9">id · email · passwordHash</text>

  <!-- Arrow Users → Projects -->
  <line x1="865" y1="266" x2="865" y2="276" stroke="#475569" stroke-width="1.5"/>
  <polygon points="861,274 865,280 869,274" fill="#475569"/>

  <!-- Table Projects -->
  <rect x="765" y="278" width="200" height="38" rx="8" fill="#2d3748" stroke="#475569" stroke-width="0.5"/>
  <rect x="765" y="278" width="4" height="38" rx="2" fill="#10b981"/>
  <text x="865" y="295" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">Projects</text>
  <text x="865" y="308" text-anchor="middle" fill="#64748b" font-size="9">id · name · apiKey · userId</text>

  <!-- Arrow Projects → Submissions -->
  <line x1="865" y1="316" x2="865" y2="326" stroke="#475569" stroke-width="1.5"/>
  <polygon points="861,324 865,330 869,324" fill="#475569"/>

  <!-- Table FormSubmissions -->
  <rect x="765" y="328" width="200" height="38" rx="8" fill="#2d3748" stroke="#475569" stroke-width="0.5"/>
  <rect x="765" y="328" width="4" height="38" rx="2" fill="#f59e0b"/>
  <text x="865" y="345" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">FormSubmissions</text>
  <text x="865" y="358" text-anchor="middle" fill="#64748b" font-size="9">id · formName · payload (JSONB)</text>

  <!-- ============ RELATIONSHIP LABELS ============ -->
  <text x="720" y="290" text-anchor="middle" fill="#475569" font-size="9">1:N</text>
  <text x="720" y="340" text-anchor="middle" fill="#475569" font-size="9">1:N</text>

  <!-- ============ BOTTOM TAGLINE ============ -->
  <line x1="200" y1="385" x2="1000" y2="385" stroke="#334155" stroke-width="1"/>
  <text x="600" y="395" text-anchor="middle" fill="#475569" font-size="11" font-weight="400">TypeScript · Express 5 · Prisma · PostgreSQL</text>

  <!-- Decorative dots -->
  <circle cx="1100" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="1120" cy="65" r="2" fill="#10b981" opacity="0.3"/>
  <circle cx="1080" cy="70" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="50" cy="40" r="2" fill="#6366f1" opacity="0.3"/>
  <circle cx="70" cy="30" r="3" fill="#8b5cf6" opacity="0.3"/>
</svg>
