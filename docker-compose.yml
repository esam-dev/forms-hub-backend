# ============================================
# Forms Hub Backend — Docker Compose
# ============================================
# Connects to your Railway PostgreSQL instance.
#
# Usage:
#   docker compose up -d
# ============================================

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      PORT: "${PORT:-3000}"
      NODE_ENV: production
      CORS_ORIGINS: "${CORS_ORIGINS}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
